[package]
name = "ghost"
version = "0.1.0"
edition = "2024"
description = "A themeable Hyprland desktop and installer for Arch Linux"
license = "MIT"
repository = "https://github.com/GhostKellz/ghost"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
toml = "1.1.6"

[profile.release]
lto = true
strip = true
codegen-units = 1

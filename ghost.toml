# Ghost components: the packages and repository files `ghost install` deploys.
# `src` is relative to the repository root; a directory is copied recursively.
# `dest` starts with `~/` (the installing user's home), or is an absolute
# system path for `root` components, which are written with sudo.
# `default = false` makes a component opt-in (`ghost install --with NAME`).
# `hooks` run with sudo after a root component's files change.
# `sources` are git repositories pinned to a full commit id: checked out at
# `dest`, or checked out in ~/.cache/ghost/sources with `run` executed inside
# (as the user). Review the code at a new commit before changing `rev`.

[components.core]
description = "Hyprland, idle, lock screen, wallpaper, audio, clipboard, and screenshots"
required = true
packages = [
    "hyprland", "hyprpaper", "hypridle", "hyprlock", "hyprpolkitagent",
    "xdg-desktop-portal-hyprland", "xdg-desktop-portal-gtk",
    "qt6-wayland", "qt5-wayland", "ttf-jetbrains-mono-nerd",
    # Used by the keybinds: volume/media keys, clipboard history, screenshots.
    "pipewire", "pipewire-pulse", "wireplumber", "playerctl",
    "cliphist", "wl-clipboard", "grim", "slurp", "satty",
    # SUPER+/ keybind help reads `hyprctl binds -j`.
    "jq",
    # Fetches the pinned sources below.
    "git",
]

[[components.core.files]]
src = "config/hypr"
dest = "~/.config/hypr"

# Lock screen avatar, the same logo as the SDDM theme.
[[components.core.files]]
src = "assets/logo.png"
dest = "~/.config/hypr/assets/logo.png"

# Independent workspaces per monitor (pure Lua). Pin the tag matching the
# installed Hyprland; reviewed at this commit: no shell, file, or network calls.
[[components.core.sources]]
name = "split-monitor-workspaces"
url = "https://github.com/Duckonaut/split-monitor-workspaces"
rev = "656ac1f024f0c1d6ec007f4c25cbc02951d51c9c" # v0.56.2
dest = "~/.config/hypr/plugins/split-monitor-workspaces"

[components.shell]
description = "Waybar, rofi, swaync, and dock"
packages = [
    "waybar", "rofi", "swaync", "nwg-dock-hyprland",
    # Opened from Waybar's audio and network modules.
    "pavucontrol", "network-manager-applet",
]

[[components.shell.files]]
src = "config/waybar"
dest = "~/.config/waybar"

[[components.shell.files]]
src = "config/rofi"
dest = "~/.config/rofi"

[[components.shell.files]]
src = "config/swaync"
dest = "~/.config/swaync"

[[components.shell.files]]
src = "config/nwg-dock-hyprland/style.css"
dest = "~/.config/nwg-dock-hyprland/style.css"

[[components.shell.files]]
src = "config/nwg-dock-hyprland/colors.css"
dest = "~/.config/nwg-dock-hyprland/colors.css"

[[components.shell.files]]
src = "config/nwg-dock-hyprland/launcher.svg"
dest = "~/.config/nwg-dock-hyprland/launcher.svg"

# nwg-dock reads (and, when you pin from the dock, writes) its pinned list at
# $XDG_CACHE_HOME/nwg-dock-pinned, not in its config directory.
[[components.shell.files]]
src = "config/nwg-dock-hyprland/pinned"
dest = "~/.cache/nwg-dock-pinned"

# NoDisplay overrides: hide developer/system tools pulled in as dependencies
# (Qt tools, Avahi browsers, lstopo, ...) from the launcher. A same-named file
# in ~/.local/share/applications replaces the system entry for this user only.
[[components.shell.files]]
src = "config/applications"
dest = "~/.local/share/applications"

[components.apps]
description = "Ghostty, Dolphin with thumbnails and archives, Tokyo Night GTK and KDE/Qt theming"
packages = [
    "ghostty", "dolphin", "archlinux-xdg-menu", "kio-extras", "ffmpegthumbs",
    "kdegraphics-thumbnailers", "ark", "kvantum",
    # KDE platform theme: Qt apps follow the Tokyo Night kdeglobals scheme.
    "plasma-integration",
    # Adwaita-dark base for the GTK 3 overrides.
    "gnome-themes-extra",
    # Ghostty's font (CaskaydiaCove Nerd Font).
    "ttf-cascadia-code-nerd",
    # Yazi terminal file manager (SUPER+SHIFT+E) and its preview/search helpers.
    "yazi", "ffmpegthumbnailer", "7zip", "poppler", "fd", "ripgrep", "fzf", "zoxide", "resvg",
]

# Tela blue icons, installed per user by upstream's script. Reviewed at this
# commit: no sudo or network; writes only its own theme directories.
[[components.apps.sources]]
name = "tela-icon-theme"
url = "https://github.com/vinceliuice/Tela-icon-theme"
rev = "a1fffc5bfab716bd022dd228ee96fe3965cdb33d"
run = ["./install.sh", "-d", "~/.local/share/icons", "blue"]

[[components.apps.files]]
src = "config/gtk-3.0"
dest = "~/.config/gtk-3.0"

[[components.apps.files]]
src = "config/gtk-4.0"
dest = "~/.config/gtk-4.0"

# GTK 3 colours ship as a theme (selected in gtk-3.0/settings.ini) so apps'
# own CSS (dock, Waybar) still takes precedence over it.
[[components.apps.files]]
src = "config/themes"
dest = "~/.local/share/themes"

[[components.apps.files]]
src = "config/ghostty"
dest = "~/.config/ghostty"

[[components.apps.files]]
src = "config/kde"
dest = "~/.config/ghost/kde"

[[components.apps.files]]
src = "config/yazi"
dest = "~/.config/yazi"

[components.sddm]
description = "Ghost login screen theme for SDDM, set as the active theme"
default = false
root = true
packages = ["sddm"]

[[components.sddm.files]]
src = "system/sddm/ghost"
dest = "/usr/share/sddm/themes/ghost"

[[components.sddm.files]]
src = "assets/logo.png"
dest = "/usr/share/sddm/themes/ghost/assets/logo.png"

[[components.sddm.files]]
src = "system/sddm/zz-ghost.conf"
dest = "/etc/sddm.conf.d/zz-ghost.conf"

[components.gpu]
description = "Stable /dev/dri/nvidia-dgpu link for NVIDIA alongside another GPU"
default = false
root = true
hooks = [
    ["udevadm", "control", "--reload"],
    ["udevadm", "trigger", "--subsystem-match=drm", "--action=change"],
    # trigger only queues events; wait so the link exists (or is gone) when ghost returns.
    ["udevadm", "settle", "--timeout=10"],
]

[[components.gpu.files]]
src = "system/udev/61-ghost-nvidia-dgpu.rules"
dest = "/etc/udev/rules.d/61-ghost-nvidia-dgpu.rules"

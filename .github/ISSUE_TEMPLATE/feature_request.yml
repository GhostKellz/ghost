name: Feature request
description: Propose a desktop or tooling improvement.
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Hardware and workflow context
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered

# ghost — lock screen. Mirrors the SDDM theme (system/sddm/ghost): a frosted
# panel with the logo, user name, and password field over the wallpaper.
# Colors mirror the active palette (Tokyo Night Night).

$font = Noto Sans
$fg = rgb(c0caf5)
$soft = rgb(a9b1d6)
$accent = rgb(7aa2f7)
$accentAlt = rgb(7dcfff)
$red = rgb(f7768e)
$yellow = rgb(e0af68)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Sharp wallpaper like the login screen; the panel carries the glass.
background {
    monitor =
    path = ~/.local/share/ghost/lockscreen.png
    color = rgb(1a1b26)
    blur_passes = 0
    brightness = 0.85
}

label {
    monitor =
    text = <span font_weight="300">$TIME</span>
    font_size = 96
    font_family = $font
    color = $fg
    shadow_passes = 2
    shadow_size = 6
    shadow_color = rgba(0000008c)
    position = 0, 340
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = $soft
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(0000008c)
    position = 0, 245
    halign = center
    valign = center
}

# Panel: surface #16161e at the SDDM panelOpacity (0.55), faint accent border.
shape {
    monitor =
    size = 440, 320
    color = rgba(16161e8c)
    rounding = 18
    border_size = 1
    border_color = rgba(7aa2f747)
    shadow_passes = 3
    shadow_size = 12
    shadow_color = rgba(00000073)
    position = 0, -10
    halign = center
    valign = center
}

image {
    monitor =
    path = ~/.config/hypr/assets/logo.png
    size = 104
    rounding = -1
    border_size = 3
    border_color = $accent $accentAlt 45deg
    position = 0, 72
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    font_size = 18
    font_family = $font
    color = $fg
    position = 0, 0
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 2
    rounding = -1
    inner_color = rgba(1f23359e)
    outer_color = $accent $accentAlt 45deg
    check_color = $accentAlt
    fail_color = $red
    capslock_color = $yellow
    font_color = $fg
    font_family = $font
    fade_on_empty = false
    placeholder_text = <span foreground="##a9b1d6">Password</span>
    fail_text = $PAMFAIL ($ATTEMPTS)
    dots_size = 0.25
    dots_spacing = 0.35
    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text = Enter to unlock
    font_size = 11
    font_family = $font
    color = rgba(a9b1d6aa)
    position = 0, -130
    halign = center
    valign = center
}

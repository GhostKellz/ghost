# ghost — lock screen. Colors mirror the active palette (Tokyo Night Night).

$font = JetBrainsMono Nerd Font
$fg = rgb(c0caf5)
$muted = rgb(565f89)
$blue = rgb(7aa2f7)
$magenta = rgb(bb9af7)
$red = rgb(f7768e)
$green = rgb(9ece6a)

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = ~/.local/share/ghost/lockscreen.png
    color = rgb(1a1b26)
    blur_passes = 2
    brightness = 0.6
}

label {
    monitor =
    text = $TIME
    font_size = 110
    font_family = $font
    color = $fg
    position = 0, 220
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 24
    font_family = $font
    color = $muted
    position = 0, 120
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 18%, 4%
    outline_thickness = 3
    inner_color = rgba(1a1b26cc)
    outer_color = $blue $magenta 45deg
    check_color = $green
    fail_color = $red
    font_color = $fg
    fade_on_empty = false
    rounding = 12
    font_family = $font
    placeholder_text = password
    fail_text = $PAMFAIL
    dots_spacing = 0.3
    position = 0, -40
    halign = center
    valign = center
}

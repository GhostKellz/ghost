# ghost — idle. OLED pixel cleaning only runs while the panels are in standby,
# so the screens blank on idle; the machine never suspends on its own.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 10 min: panels to standby (DPMS off, never output-disable — that's a hotplug
# and reshuffles windows onto the other monitor).
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 15 min: lock behind the blanked panels.
listener {
    timeout = 900
    on-timeout = loginctl lock-session
}

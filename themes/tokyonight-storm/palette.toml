# Tokyo Night — Storm. Colors from folke/tokyonight.nvim (Apache-2.0),
# lua/tokyonight/colors/storm.lua.
name = "tokyonight-storm"
display_name = "Tokyo Night Storm"
wallpaper_set = "storm"

[colors]
bg = "#24283b"
bg_dark = "#1f2335"
bg_dark1 = "#1b1e2d"
bg_highlight = "#292e42"
fg = "#c0caf5"
fg_dark = "#a9b1d6"
fg_gutter = "#3b4261"
comment = "#565f89"
dark3 = "#545c7e"
dark5 = "#737aa2"
terminal_black = "#414868"
blue = "#7aa2f7"
blue0 = "#3d59a1"
blue1 = "#2ac3de"
blue7 = "#394b70"
cyan = "#7dcfff"
green = "#9ece6a"
green1 = "#73daca"
magenta = "#bb9af7"
purple = "#9d7cd8"
orange = "#ff9e64"
red = "#f7768e"
red1 = "#db4b4b"
teal = "#1abc9c"
yellow = "#e0af68"

# Semantic roles used by every surface (Hyprland borders, bar, launcher, …).
[roles]
background = "bg"
surface = "bg_dark"
surface_alt = "bg_highlight"
text = "fg"
text_soft = "fg_dark"
text_muted = "comment"
accent = "blue"
accent_alt = "magenta"
border_active = "blue"
border_active_alt = "magenta"
border_inactive = "terminal_black"
urgent = "red"
warning = "yellow"
success = "green"

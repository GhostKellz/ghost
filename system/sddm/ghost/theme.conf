[General]
# Wallpaper path, absolute or relative to this theme directory. Empty uses backgroundColor.
background=
backgroundColor=#1a1b26
# Without a wallpaper, draw soft blue/cyan light over the base colour so the
# panel's frosted glass has something to blur. false = flat backgroundColor.
glow=true

# Image in the avatar circle: "logo", or "user" for the account picture (falls back to the logo).
avatar=logo
logo=assets/logo.png

accent=#7aa2f7
accentAlt=#7dcfff
panelOpacity=0.55
# Maximum blur radius of the wallpaper behind the panel, in pixels. 0 disables it.
blur=64
font=Noto Sans
